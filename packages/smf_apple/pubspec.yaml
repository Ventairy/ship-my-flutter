name: smf_apple
description: Apple platform delivery for SMF release automation.
version: 0.1.0
repository: https://github.com/Ventairy/smf
issue_tracker: https://github.com/Ventairy/smf/issues
topics:
  - ios
  - testflight
  - app-store
  - release

environment:
  sdk: ">=3.10.0 <4.0.0"

resolution: workspace

dependencies:
  dart_jsonwebtoken: ^3.4.1
  freezed_annotation: ^3.1.0
  http: ^1.5.0
  json_annotation: ^4.12.0
  path: ^1.9.1
  # The unpublished 0.1 workspace and first stable 1.x releases share this API.
  smf_engine: ">=0.1.0 <2.0.0"
  xml: ^7.0.1

dev_dependencies:
  build_runner: ^2.15.3
  freezed: ^4.0.0-dev.3
  frontend_server_client: ^4.0.0
  json_serializable: ^6.14.0
  test: 1.31.2
