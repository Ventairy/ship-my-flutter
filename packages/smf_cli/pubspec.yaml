name: smf_cli
description: Command-line interface for SMF release automation.
version: 0.1.0
repository: https://github.com/Ventairy/smf
issue_tracker: https://github.com/Ventairy/smf/issues
topics:
  - cli
  - flutter
  - release

environment:
  sdk: ">=3.10.0 <4.0.0"

resolution: workspace

executables:
  smf: smf

dependencies:
  args: ^2.7.0
  path: ^1.9.1
  pub_semver: ^2.2.0
  # The unpublished bootstrap and first stable release must resolve together.
  # The v1 release commit narrows this to ^1.0.0 before publication.
  smf_engine: ">=0.1.0 <2.0.0"

dev_dependencies:
  # Keep aligned with smf_engine; see its analyzer compatibility note.
  test: 1.30.0
  yaml: ^3.1.3
