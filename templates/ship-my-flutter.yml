name: Ship my Flutter

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ship-my-flutter-${{ github.repository }}
  cancel-in-progress: false

jobs:
  pull_request:
    name: pull-request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      phase: ${{ steps.ship.outputs.phase }}
      branch: ${{ steps.ship.outputs.branch }}
      version: ${{ steps.ship.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: ship
        uses: Ventairy/ship-my-flutter-action@v1
        with:
          phase: pull-request

  release_candidate:
    name: release-candidate
    needs: pull_request
    if: needs.pull_request.outputs.phase == 'release-candidate'
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.pull_request.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: ${{ hashFiles('.fvmrc') != '' && '.fvmrc' || '' }}
          cache: true
          pub-cache: true
      - uses: Ventairy/ship-my-flutter-action@v1
        with:
          phase: release-candidate
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key-base64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          ios-certificate-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          ios-certificate-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          ios-provisioning-profiles-base64: ${{ secrets.IOS_PROVISIONING_PROFILES_BASE64 }}

  ship:
    needs: pull_request
    if: needs.pull_request.outputs.phase == 'ship'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Ventairy/ship-my-flutter-action@v1
        with:
          phase: ship
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-private-key-base64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
