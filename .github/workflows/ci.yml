name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Dart ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: [3.10.0, stable]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: ${{ matrix.sdk }}

      - name: Resolve dependencies
        run: dart pub get

      - name: Regenerate committed sources
        run: dart run melos run gen --no-select

      - name: Verify generated sources
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- packages)" ]]; then
            git status --short --untracked-files=all -- packages
            git diff -- packages
            exit 1
          fi

      - name: Verify formatting
        if: matrix.sdk == 'stable'
        run: dart run tool/check_dart_format.dart

      - name: Verify documentation links
        if: matrix.sdk == 'stable'
        run: dart run tool/check_markdown_links.dart

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart run melos run test --no-select

      - name: Check patch whitespace
        run: git diff --check

  minimum-dependencies:
    name: Minimum dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Dart 3.10
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: 3.10.0

      - name: Resolve minimum dependencies
        run: dart pub downgrade

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: dart run melos run test --no-select

  package:
    name: Package archive
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up stable Dart
        uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
        with:
          sdk: stable

      - name: Resolve dependencies
        run: dart pub get

      - name: Validate the pub.dev archive
        run: dart run melos run publish:dry-run --no-select
